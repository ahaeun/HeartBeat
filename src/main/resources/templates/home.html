<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>홈</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f7; }
        .card { background: #fff; padding: 32px 40px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 360px; text-align: center; }
        h1 { margin: 0 0 12px; font-size: 22px; color: #333; }
        .user { font-size: 16px; color: #4f46e5; margin-bottom: 24px; }
        .status { font-size: 13px; color: #666; margin-bottom: 20px; }
        .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; }
        .status .dot.dead { background: #d92d20; }
        button {
            padding: 10px 24px; background: #ef4444; color: #fff;
            border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
        }
        button:hover { background: #dc2626; }
    </style>
</head>
<body>
<div class="card">
    <h1>환영합니다</h1>
    <div class="user">
        로그인 사용자: <strong th:text="${username}"></strong>
    </div>
    <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">세션 확인 중...</span>
    </div>
    <form method="post" action="/logout">
        <button type="submit">로그아웃</button>
    </form>
</div>

<script>
    const PING_INTERVAL_MS = 10_000;
    const IDLE_DISPLAY_MS = 1500;
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');

    let activeSinceLastPing = false;
    let sessionAlive = true;
    let displayState = 'idle';
    let idleTimer = null;

    function showActive() {
        if (!sessionAlive) return;
        dot.classList.remove('dead');
        statusText.textContent = '활동 감지 (' + new Date().toLocaleTimeString() + ')';
        displayState = 'active';
    }

    function showIdle() {
        if (!sessionAlive) return;
        dot.classList.remove('dead');
        statusText.textContent = '대기 중';
        displayState = 'idle';
    }

    function scheduleIdle() {
        if (idleTimer !== null) {
            clearTimeout(idleTimer);
        }
        idleTimer = setTimeout(() => {
            idleTimer = null;
            showIdle();
        }, IDLE_DISPLAY_MS);
    }

    const activityEvents = ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart'];
    activityEvents.forEach(evt => {
        document.addEventListener(evt, () => {
            activeSinceLastPing = true;
            showActive();
            scheduleIdle();
        }, { passive: true });
    });

    async function ping() {
        const active = activeSinceLastPing;
        activeSinceLastPing = false;
        try {
            const res = await fetch('/api/heartbeat?active=' + active, { method: 'POST' });
            const data = await res.json();
            if (data.alive) {
                sessionAlive = true;
                if (displayState === 'idle') {
                    showIdle();
                }
            } else {
                sessionAlive = false;
                if (idleTimer !== null) {
                    clearTimeout(idleTimer);
                    idleTimer = null;
                }
                dot.classList.add('dead');
                statusText.textContent = '세션 만료 - 로그인 페이지로 이동합니다';
                setTimeout(() => { window.location.href = '/login'; }, 800);
            }
        } catch (e) {
            dot.classList.add('dead');
            statusText.textContent = '서버 연결 실패';
        }
    }

    ping();
    setInterval(ping, PING_INTERVAL_MS);
</script>
</body>
</html>

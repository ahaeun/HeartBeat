<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f7; }
        .card { background: #fff; padding: 32px 40px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 320px; }
        h1 { margin: 0 0 24px; font-size: 20px; text-align: center; color: #333; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px 12px; margin-bottom: 16px;
            border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        button {
            width: 100%; padding: 10px; background: #4f46e5; color: #fff;
            border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
        }
        button:hover { background: #4338ca; }
        .error { color: #d92d20; font-size: 13px; margin-bottom: 12px; text-align: center; }
        .hint { font-size: 12px; color: #888; text-align: center; margin-top: 12px; }
    </style>
</head>
<body>
<div class="card">
    <h1>로그인</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form method="post" action="/login">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
    </form>
    <p class="hint">테스트 계정: test / qwer</p>
</div>
</body>
</html>
